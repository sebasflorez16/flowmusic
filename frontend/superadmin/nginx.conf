server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta sirve index.html (react-router / pathname).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché larga para assets con hash de contenido.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
